name: Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag for manual publish
        required: true
        default: edge
      publish_latest:
        description: Also publish the same image as latest
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
  IMAGE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: wrighttest-backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            image: wrighttest-frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: novnc
            image: wrighttest-novnc
            context: ./novnc
            dockerfile: ./novnc/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Verify Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Missing GitHub Actions secret: DOCKERHUB_USERNAME"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: DOCKERHUB_TOKEN"
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.IMAGE_VERSION }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.publish_latest }}
          labels: |
            org.opencontainers.image.title=WrightTest ${{ matrix.name }}
            org.opencontainers.image.description=Low-code Playwright UI testing platform component.
            org.opencontainers.image.url=https://wrighttest.com
            org.opencontainers.image.source=https://github.com/AlexFilippov-it/wrighttest
            org.opencontainers.image.documentation=https://github.com/AlexFilippov-it/wrighttest#readme
            org.opencontainers.image.licenses=WrightTest Source-Available License v1.0

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
